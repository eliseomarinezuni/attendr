[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --disable-socket"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pyright]
include = ["main.py", "runner.py", "src", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
