name: Academic Assistant Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting report
        continue-on-error: true # Existing formatting drift is tracked without a mass rewrite.
        run: ruff format --check .
      - name: Pyright
        run: pyright --pythonpath "$(command -v python)"
      - name: Python tests and coverage
        run: python -m pytest --cov=src/academic_assistant --cov=main --cov-report=term-missing
      - name: Audit locked Python dependencies
        run: pip-audit --strict --no-deps --disable-pip -r requirements.lock

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Worker tests
        run: npm test
        working-directory: worker
      - name: TypeScript check
        run: npm run check
        working-directory: worker
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker
      - name: Report full npm dependency audit
        run: npm audit --audit-level=critical
        working-directory: worker

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
