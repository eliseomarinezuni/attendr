name: Scheduled Academic Assistant

on:
  schedule:
    - cron: "0 8-22/2 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

# This label must identify ONE trusted machine with a persistent ATTENDR_HOME.
permissions:
  contents: read
concurrency:
  group: attendr-scheduled
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, attendr]
    timeout-minutes: 15
    env:
      ATTENDR_HOME: ${{ vars.ATTENDR_HOME }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run with persistent state and refreshed OAuth token
        run: '"$ATTENDR_HOME/venv/bin/python" scripts/scheduled_run.py'
