name: Scheduled Academic Assistant

on:
  schedule:
    # Avoid GitHub's documented top-of-hour scheduling congestion. The Worker
    # watchdog dispatches a recovery run if this heartbeat becomes stale.
    - cron: "17 8-22/2 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: attendr-scheduled
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Restore private configuration
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
          DISCORD_CALENDAR_CHANNEL_ID: ${{ secrets.DISCORD_CALENDAR_CHANNEL_ID }}
          DISCORD_QUIZ_CHANNEL_ID: ${{ secrets.DISCORD_QUIZ_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_SLIDES_TOKEN_B64: ${{ secrets.GOOGLE_SLIDES_TOKEN_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_NAME: ${{ secrets.GOOGLE_CALENDAR_NAME }}
          GOOGLE_STUDY_CALENDAR_NAME: ${{ secrets.GOOGLE_STUDY_CALENDAR_NAME }}
          STUDY_WORKER_URL: ${{ secrets.STUDY_WORKER_URL }}
          STUDY_SYNC_SECRET: ${{ secrets.STUDY_SYNC_SECRET }}
          DAILY_QUIZ_TOPIC: ${{ secrets.DAILY_QUIZ_TOPIC }}
        run: bash scripts/restore_ci_config.sh
      - name: Run with durable cloud state
        env:
          ATTENDR_ASK_SYNC: "true"
          LECTURE_MAX_FILE_MB: "768"
          LECTURE_QUIZ_RETRY_HOURS: "336"
          ATTENDR_STATE_KEY: ${{ secrets.ATTENDR_STATE_KEY }}
        run: python scripts/cloud_run.py
