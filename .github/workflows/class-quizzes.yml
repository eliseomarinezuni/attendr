name: Post-Class Lecture Quizzes

on:
  schedule:
    - cron: "30 21 * * 1,4"
      timezone: "America/Toronto"
    - cron: "0 11 * * 3,5"
      timezone: "America/Toronto"
    - cron: "0 14 * * 2,4,5"
      timezone: "America/Toronto"
    - cron: "0 17 * * 3,5"
      timezone: "America/Toronto"
  workflow_dispatch:

# This label must identify ONE trusted machine with a persistent ATTENDR_HOME.
permissions:
  contents: read
concurrency:
  group: attendr-scheduled
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, attendr]
    timeout-minutes: 15
    env:
      ATTENDR_HOME: ${{ vars.ATTENDR_HOME }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run with persistent state and refreshed OAuth token
        run: '"$ATTENDR_HOME/venv/bin/python" scripts/scheduled_run.py --lecture-quizzes'
