name: Post-Class Lecture Review

on:
  schedule:
    # Two chances per lecture, 15 and 45 minutes after it ends. The runtime
    # independently rejects anything older than one hour.
    - cron: "15,45 21 * * 1,4"
      timezone: "America/Toronto"
    - cron: "15,45 11 * * 3,5"
      timezone: "America/Toronto"
    - cron: "15,45 14 * * 2,4,5"
      timezone: "America/Toronto"
    - cron: "15,45 17 * * 3,5"
      timezone: "America/Toronto"
    # Temporary, quota-safe historical-summary campaign: one new Gemini summary
    # daily at 9:30 AM, from Sep 20 through Oct 15, 2026.
    - cron: "30 9 20-30 9 *"
      timezone: "America/Toronto"
    - cron: "30 9 1-15 10 *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: attendr-scheduled
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'eliseomarinezuni/attendr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Restore private configuration
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ""
          DISCORD_CALENDAR_CHANNEL_ID: ""
          DISCORD_QUIZ_CHANNEL_ID: ${{ secrets.DISCORD_QUIZ_CHANNEL_ID }}
          DISCORD_LECTURE_SUMMARIES_CHANNEL_ID: ${{ secrets.DISCORD_LECTURE_SUMMARIES_CHANNEL_ID }}
          GOOGLE_SLIDES_TOKEN_B64: ${{ secrets.GOOGLE_SLIDES_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_LECTURE_SUMMARY_MODEL: ${{ secrets.GEMINI_LECTURE_SUMMARY_MODEL }}
          STUDY_WORKER_URL: ${{ secrets.STUDY_WORKER_URL }}
          STUDY_SYNC_SECRET: ${{ secrets.STUDY_SYNC_SECRET }}
          COURSE_SCHEDULE_B64: ${{ secrets.COURSE_SCHEDULE_B64 }}
          ATTENDR_PREFERENCES_B64: ${{ secrets.ATTENDR_PREFERENCES_B64 }}
        run: bash scripts/restore_ci_config.sh
      - name: Send due lecture summaries and quizzes with durable cloud state
        if: github.event.schedule != '30 9 20-30 9 *' && github.event.schedule != '30 9 1-15 10 *'
        env:
          ATTENDR_STATE_KEY: ${{ secrets.ATTENDR_STATE_KEY }}
          LECTURE_REVIEW_MAX_AGE_MINUTES: "60"
          DISCORD_QUIET_HOURS_START: "0"
          DISCORD_QUIET_HOURS_END: "9"
        run: python scripts/cloud_run.py --lecture-quizzes
      - name: Send one quota-safe historical lecture summary
        if: github.event.schedule == '30 9 20-30 9 *' || github.event.schedule == '30 9 1-15 10 *'
        env:
          ATTENDR_STATE_KEY: ${{ secrets.ATTENDR_STATE_KEY }}
          LECTURE_QUIZ_RETRY_HOURS: "8760"
          LECTURE_REVIEW_MAX_AGE_MINUTES: "525600"
          LECTURE_SUMMARY_MAX_GENERATIONS_PER_RUN: "1"
          DISCORD_QUIET_HOURS_START: "0"
          DISCORD_QUIET_HOURS_END: "9"
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then
            echo "Historical lecture-summary campaign is complete."
            exit 0
          fi
          python scripts/cloud_run.py --lecture-summaries
