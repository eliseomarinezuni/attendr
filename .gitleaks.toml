[extend]
useDefault = true

[[allowlists]]
description = "D1 column names mistaken for a generic API key"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''excluded\.token,lease_until''']

[[allowlists]]
description = "Documented Discord application ID placeholder"
targetRules = ["discord-client-secret"]
regexTarget = "match"
regexes = ['''DISCORD_APPLICATION_ID=replace_with_your_application_id''']
